<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | Jízdní</title>
    <link rel="icon" type="image/png" href="./src/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F4F4F0;
            --text-color: #1A1A1A;
            --text-muted: #666666;
            --accent-green: #2C4A3B;
            --accent-cyan: #40C4C4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 1rem 5%;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            background: var(--bg-color);
        }

        .back-link {
            text-decoration: none;
            color: var(--accent-cyan);
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: gap 0.3s;
        }

        .back-link:hover { gap: 0.8rem; }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 4rem 5% 6rem;
        }

        .article-header {
            margin-bottom: 3rem;
            text-align: center;
        }

        .article-meta {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-cyan);
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .article-hero {
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-green) 100%);
            margin-bottom: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.9);
            font-size: 4rem;
        }

        .article-content {
            font-size: 1.15rem;
            font-weight: 300;
            color: #2A2A2A;
        }

        .article-content p {
            margin-bottom: 1.8rem;
        }

        .article-content p:first-of-type::first-letter {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            float: left;
            line-height: 0.8;
            margin-right: 0.1em;
            color: var(--accent-cyan);
        }

        .error-msg {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .article-hero { height: 250px; }
            .article-content { font-size: 1.05rem; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-link">← Back to articles</a>
    </header>

    <main id="main-content">
        <div class="error-msg">Loading article...</div>
    </main>

    <script>
        async function loadArticle() {
            const params = new URLSearchParams(window.location.search);
            const filename = params.get('file');

            if (!filename) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const response = await fetch(`./publish/${filename}`);
                if (!response.ok) throw new Error('Article not found');
                const article = await response.json();

                const date = new Date(article.date).toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
                document.title = `${article.title} | Jízdní`;

                const paragraphs = article.content.split('\n\n').map(p => `<p>${p.trim()}</p>`).join('');

                document.getElementById('main-content').innerHTML = `
                    <div class="article-header">
                        <div class="article-meta">${article.location} — ${date}</div>
                        <h1>${article.title}</h1>
                    </div>
                    <div class="article-hero">🚲</div>
                    <div class="article-content">
                        ${paragraphs}
                    </div>
                `;
            } catch (error) {
                document.getElementById('main-content').innerHTML = `
                    <div class="error-msg">
                        <h2>Article not found</h2>
                        <p>The requested file does not exist or has been moved.</p>
                        <a href="index.html" style="color: var(--accent-cyan); margin-top: 1rem; display: inline-block;">Back to home</a>
                    </div>
                `;
            }
        }
        loadArticle();
    </script>
</body>
</html>
