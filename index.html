<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jízdní | European Cycling Mechanics & Culture</title>
    <link rel="icon" type="image/png" href="./src/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F4F4F0;
            --text-color: #1A1A1A;
            --text-muted: #666666;
            --accent-green: #2C4A3B;
            --accent-cyan: #40C4C4;
            --border-color: #D0D0D0;
            --white: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 1.5rem 5%;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }

        .logo img {
            height: 50px;
            width: auto;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--accent-green);
            letter-spacing: -0.5px;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 5%;
        }

        .hero {
            text-align: center;
            margin-bottom: 5rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-color);
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 300;
        }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 3rem 2rem;
        }

        .article-card {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .article-card:hover {
            transform: translateY(-5px);
        }

        .article-image {
            width: 100%;
            aspect-ratio: 16/10;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-green) 100%);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.9);
            font-size: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .article-image::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('data:image/svg+xml;utf8,<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.1)"/></svg>');
        }

        .article-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-cyan);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .article-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            line-height: 1.3;
        }

        .article-excerpt {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 300;
            line-height: 1.7;
        }

        .loading, .no-articles {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
            font-style: italic;
        }

        footer {
            text-align: center;
            padding: 3rem 5%;
            border-top: 1px solid rgba(0,0,0,0.08);
            margin-top: 5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            opacity: 0.4;
            transition: opacity 0.3s;
            font-size: 0.75rem;
        }

        footer a:hover { opacity: 0.7; }

        @media (max-width: 768px) {
            .hero h2 { font-size: 2rem; }
            .articles-grid { grid-template-columns: 1fr; }
            .logo img { height: 40px; }
            .logo-text { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="./src/logo.gif" alt="Jízdní">
            <span class="logo-text">Jízdní</span>
        </a>
    </header>

    <main>
        <div class="hero">
            <h2>The simple art of cycling across Europe</h2>
            <p>Articles, portraits, and reflections on sustainable mobility and cycling.</p>
        </div>

        <div id="loading" class="loading">Loading editorial content...</div>
        <div id="articles-container" class="articles-grid"></div>
        <div id="no-articles" class="no-articles" style="display: none;">No publications at the moment.</div>
    </main>

    <footer>
        <p>&copy; 2026 Jízdní Magazine. All rights reserved.</p>
        <p style="margin-top: 1.5rem;"><a href="https://www.flaticon.com/free-animated-icons/bicycle" title="bicycle animated icons">Bicycle animated icons created by Magnific - Flaticon</a></p>
    </footer>

    <script>
        async function loadArticles() {
            try {
                const response = await fetch('./publish/manifest.json');
                const manifest = await response.json();
                
                if (!manifest.articles || manifest.articles.length === 0) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('no-articles').style.display = 'block';
                    return;
                }

                const articles = await Promise.all(
                    manifest.articles.map(async (meta) => {
                        const res = await fetch(`./publish/${meta.filename}`);
                        return { ...meta, ...(await res.json()) };
                    })
                );

                document.getElementById('loading').style.display = 'none';
                const container = document.getElementById('articles-container');
                
                articles.sort((a, b) => new Date(b.date) - new Date(a.date));

                articles.forEach(article => {
                    const date = new Date(article.date).toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
                    const excerpt = article.content.replace(/[#*]/g, '').substring(0, 120).trim() + '...';
                    
                    const card = document.createElement('a');
                    card.className = 'article-card';
                    card.href = `article.html?file=${encodeURIComponent(article.filename)}`;
                    card.innerHTML = `
                        <div class="article-image">🚲</div>
                        <div class="article-meta">${article.location} — ${date}</div>
                        <h3 class="article-title">${article.title}</h3>
                        <p class="article-excerpt">${excerpt}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('no-articles').style.display = 'block';
            }
        }
        loadArticles();
    </script>
</body>
</html>
